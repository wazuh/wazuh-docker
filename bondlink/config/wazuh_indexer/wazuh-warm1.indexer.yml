network.host: wazuh-warm1.indexer
node.name: wazuh-warm1.indexer
node.attr.temp: warm
cluster.name: wazuh-cluster
discovery.seed_hosts:
  - wazuh1.indexer
  - wazuh2.indexer
  - wazuh3.indexer
path.data: /var/lib/wazuh-indexer
path.logs: /var/log/wazuh-indexer
# path.repo: /mnt/backups  -- left disabled to match the source fork: the
# warm host isn't wired into the /mnt/backups shared mount (see
# docker-compose-warm.yml), only the hot-cluster services are.
plugins.security.ssl.http.pemcert_filepath: ${OPENSEARCH_PATH_CONF}/certs/wazuh-warm1.indexer.pem
plugins.security.ssl.http.pemkey_filepath: ${OPENSEARCH_PATH_CONF}/certs/wazuh-warm1.indexer.key
plugins.security.ssl.http.pemtrustedcas_filepath: ${OPENSEARCH_PATH_CONF}/certs/root-ca.pem
plugins.security.ssl.transport.pemcert_filepath: ${OPENSEARCH_PATH_CONF}/certs/wazuh-warm1.indexer.pem
plugins.security.ssl.transport.pemkey_filepath: ${OPENSEARCH_PATH_CONF}/certs/wazuh-warm1.indexer.key
plugins.security.ssl.transport.pemtrustedcas_filepath: ${OPENSEARCH_PATH_CONF}/certs/root-ca.pem
plugins.security.ssl.http.enabled: true
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.transport.resolve_hostname: false
plugins.security.authcz.admin_dn:
- "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.check_snapshot_restore_write_privileges: true
plugins.security.enable_snapshot_restore_privilege: true
plugins.security.nodes_dn:
- "CN=wazuh-warm1.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
- "CN=wazuh1.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
- "CN=wazuh2.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
- "CN=wazuh3.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
- "CN=filebeat,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.restapi.roles_enabled:
- "all_access"
- "security_rest_api_access"
plugins.security.allow_default_init_securityindex: true
plugins.query.datasources.encryption.masterkey: "__WAZUH_INDEXER_DATASOURCES_KEY__"
cluster.routing.allocation.disk.threshold_enabled: false
compatibility.override_main_response_version: true
