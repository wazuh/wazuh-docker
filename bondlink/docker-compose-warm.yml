# Standalone compose file for the warm-tier indexer, deployed on a separate
# host from the hot cluster (matches current prod topology) and joined via
# extra_hosts + a static IP on wazuh.master/wazuh.worker (see
# docker-compose.override.yml). Run this on the warm host itself:
#
#   docker compose -f docker-compose-warm.yml --project-directory . up -d
#
# Fixed from the 4.10 source: that fork's docker-compose-warm.yml referenced
# config/wazuh_indexer/wazuh-warm1.indexer.yml and wazuh-warm1.indexer*.pem,
# but the actual tracked files were named without the "1" suffix
# (wazuh-warm.indexer.yml) -- as committed, that file would have failed to
# start. This port standardizes on the "1" suffix everywhere (matching
# certs.yml and every hot node's NODES_DN entry).
#
# opensearch.yml is mounted from /etc/wazuh-docker-runtime/ (salt-rendered
# on the main host, real masterkey already substituted -- see
# salt/wazuh-docker/init.sls in the salt repo), not from this checkout,
# same reason as docker-compose.override.yml's indexer mounts: a live file
# bind mount turns that path into a real mount point on the host, and
# github_checkout's force_reset can't unlink a mount point. Since this warm
# host isn't the salt-managed checkout host, copy that one file over
# alongside the certs -- see README.md's "Warm-host deployment note".
services:
  wazuh-warm1.indexer:
    # Pinned by digest -- see bondlink/docker-compose.override.yml for why.
    image: wazuh/wazuh-indexer@sha256:0f1eb6c22912ca7948679cc3eca05346464678a42cab5cf5b1e17b99659e3582
    hostname: wazuh-warm1.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
      - WAZUH_INDEXER_NODE_TYPE=warm
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "1.5"
    volumes:
      - wazuh-indexer-data-warm-1:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh-warm1.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh-warm1.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh-warm1.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh-warm1.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - /etc/wazuh-docker-runtime/wazuh-warm1.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

volumes:
  wazuh-indexer-data-warm-1:
