user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;

    keepalive_timeout  65;

    server_tokens off;
    gzip  on;

}



# load balancer for Wazuh cluster
stream {
    # Wazuh 5.x agents: TLS passthrough to remoted's HTTPS API, which also
    # carries enrollment. Without the 'ssl' keyword NGINX takes no part in the
    # encryption, so the agent validates the manager certificate and its own
    # client certificate reaches remoted intact.
    upstream mycluster_https {
        hash $remote_addr consistent;
        server wazuh.master:1517;
        server wazuh.worker:1517;
    }
    server {
        listen 1517;
        proxy_pass mycluster_https;
    }

    # Wazuh 4.x agents: legacy remoted.
    upstream mycluster {
        hash $remote_addr consistent;
        server wazuh.master:1514;
        server wazuh.worker:1514;
    }
    server {
        listen 1514;
        proxy_pass mycluster;
    }
}